name: Phone builds
on: [push, workflow_dispatch]
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 24}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: 21}
      - name: Set up required Android SDK packages
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;35.0.0'
      - run: npm ci
      - run: npm test
      - run: npm run build && npx cap sync android
      - run: chmod +x android/gradlew && android/gradlew -p android :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with: {name: WhiteHole-Android-preview, path: android/app/build/outputs/apk/debug/app-debug.apk}
  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 24}
      - run: bash scripts/build-ios.sh simulator
      - uses: actions/upload-artifact@v4
        with: {name: WhiteHole-iOS-simulator, path: work/ios-build/Build/Products/Debug-iphonesimulator/App.app}
